name: Blackhole Auth Production Infrastructure CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GitHub SHA
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Generate Compose file for validation
        run: |
          sed "s|IMG_TAG|$short_sha|g" docker-compose.production.template.yml > docker-compose.production.yml

      - name: Create stub .env for compose validation
        run: |
          mkdir -p backend frontend
          touch backend/.env frontend/.env

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.production.yml config

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            docker-compose.production.template.yml

  build:
    name: Build production images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker buildx build --push \
            --tag bhiv/blackhole-auth-backend:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/blackhole-auth-backend:latest \
            -f backend/Dockerfile backend

      - name: Build and push frontend image
        run: |
          # Priority 1: Direct secrets VITE_API_BASE_URL / VITE_AUTH_SERVER_URL
          VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
          VITE_AUTH_SERVER_URL="${{ secrets.VITE_AUTH_SERVER_URL }}"

          # Priority 2: Extract from FRONTEND_ENV_FILE secret if not set directly
          FRONTEND_SECRET="${{ secrets.FRONTEND_ENV_FILE || secrets.BLACKHOLE_AUTH_FRONTEND_ENV_FILE }}"
          if [ -n "$FRONTEND_SECRET" ]; then
            if [ -z "$VITE_API_BASE_URL" ]; then
              VITE_API_BASE_URL=$(echo "$FRONTEND_SECRET" | grep '^VITE_API_BASE_URL=' | cut -d '=' -f2- || true)
            fi
            if [ -z "$VITE_AUTH_SERVER_URL" ]; then
              VITE_AUTH_SERVER_URL=$(echo "$FRONTEND_SECRET" | grep '^VITE_AUTH_SERVER_URL=' | cut -d '=' -f2- || true)
            fi
          fi

          # Priority 3: Fallback default
          if [ -z "$VITE_API_BASE_URL" ]; then
            VITE_API_BASE_URL="http://163.128.209.18:8087"
          fi
          if [ -z "$VITE_AUTH_SERVER_URL" ]; then
            VITE_AUTH_SERVER_URL="http://163.128.209.18:8087"
          fi

          docker buildx build --push \
            --tag bhiv/blackhole-auth-frontend:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/blackhole-auth-frontend:latest \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_AUTH_SERVER_URL="$VITE_AUTH_SERVER_URL" \
            -f frontend/Dockerfile frontend

  deploy:
    name: Deploy to remote production VM via SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts

      - name: Create env files from secrets
        run: |
          mkdir -p backend frontend

          BACKEND_SECRET="${{ secrets.BACKEND_ENV_FILE }}"
          if [ -z "$BACKEND_SECRET" ]; then
            BACKEND_SECRET="${{ secrets.BLACKHOLE_AUTH_BACKEND_ENV_FILE }}"
          fi

          if [ -n "$BACKEND_SECRET" ]; then
            cat <<'EOF' > backend/.env
          ${{ secrets.BACKEND_ENV_FILE || secrets.BLACKHOLE_AUTH_BACKEND_ENV_FILE }}
          EOF
          else
            echo "PORT=8080" > backend/.env
            echo "NODE_ENV=production" >> backend/.env
            echo "JWT_SECRET=production-secret-change-me" >> backend/.env
            echo "AUTH_SERVER_URL=https://auth.blackholeinfiverse.com" >> backend/.env
          fi

          FRONTEND_SECRET="${{ secrets.FRONTEND_ENV_FILE }}"
          if [ -z "$FRONTEND_SECRET" ]; then
            FRONTEND_SECRET="${{ secrets.BLACKHOLE_AUTH_FRONTEND_ENV_FILE }}"
          fi

          if [ -n "$FRONTEND_SECRET" ]; then
            cat <<'EOF' > frontend/.env
          ${{ secrets.FRONTEND_ENV_FILE || secrets.BLACKHOLE_AUTH_FRONTEND_ENV_FILE }}
          EOF
          else
            echo "VITE_API_BASE_URL=http://163.128.209.18:8087" > frontend/.env
            echo "VITE_AUTH_SERVER_URL=http://163.128.209.18:8087" >> frontend/.env
          fi

      - name: Tar deployment files
        run: |
          tar -czf deployment.tar.gz docker-compose.production.template.yml backend frontend

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Create BLACKHOLE_AUTH directory on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "mkdir -p ~/BLACKHOLE_AUTH"

      - name: Copy deployment tarball to VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" scp -P ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no deployment.tar.gz ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:~/BLACKHOLE_AUTH/deployment.tar.gz

      - name: Deploy production stack on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE_AUTH

            # Clean directory first, keeping docs folder and the tarball
            find . -mindepth 1 ! -name docs ! -path './docs/*' ! -name deployment.tar.gz -exec rm -rf {} +

            # Extract deployment archive and clean up tarball
            tar -xzf deployment.tar.gz
            rm -f deployment.tar.gz

            # Confirm Docker availability
            docker version
            docker compose version

            # Log in to Docker Hub on the VM
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Restore persistent Release History
            mkdir -p docs
            if [ -f /var/tmp/BLACKHOLE_AUTH/RELEASE_HISTORY.md ]; then
              cp /var/tmp/BLACKHOLE_AUTH/RELEASE_HISTORY.md docs/RELEASE_HISTORY.md
            fi

            # Generate target compose file from template
            sed "s|IMG_TAG|${{ needs.build.outputs.sha_short }}|g" docker-compose.production.template.yml > docker-compose.production.yml

            # Validate compose config before deploy
            docker compose -f docker-compose.production.yml config

            # Pull images
            docker compose -f docker-compose.production.yml pull

            # Log out from Docker Hub
            docker logout

            # Start services
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # Verify deployment status
            docker compose -f docker-compose.production.yml ps

            # Health Check loop (12 attempts x 10s = 120s timeout)
            echo "Waiting for services to be healthy..."
            for i in {1..12}; do
              if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q >/dev/null 2>&1; then
                UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
              else
                UNHEALTHY_COUNT=0
                STARTING_COUNT=0
              fi

              # Backend Health Check
              BACKEND_HEALTH=0
              BACKEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole_auth_backend 2>/dev/null || echo "missing")
              [ "$BACKEND_STATUS" = "healthy" ] && BACKEND_HEALTH=1

              # Frontend Health Check
              FRONTEND_HEALTH=0
              FRONTEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole_auth_frontend 2>/dev/null || echo "missing")
              if [ "$FRONTEND_STATUS" = "healthy" ] || curl -sf http://localhost:5180 > /dev/null 2>&1; then
                FRONTEND_HEALTH=1
              fi

              if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$BACKEND_HEALTH" -eq 1 ] && [ "$FRONTEND_HEALTH" -eq 1 ]; then
                echo "All containers, backend API, and frontend launcher are healthy!"
                break
              fi

              if [ "$i" -eq 12 ]; then
                echo "Health check failed!"
                docker compose -f docker-compose.production.yml ps
                docker compose -f docker-compose.production.yml logs --tail=50
                exit 1
              fi

              echo "Status: $STARTING_COUNT starting, $UNHEALTHY_COUNT unhealthy, backend=$BACKEND_HEALTH, frontend=$FRONTEND_HEALTH. Retrying in 10s..."
              sleep 10
            done

            # Prune old images (older than 7 days)
            docker image prune -af --filter "until=168h"
          EOF

      - name: Update Release Documentation on Success
        if: success()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE_AUTH
            if [ ! -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p docs
              echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
              echo "" >> docs/RELEASE_HISTORY.md
              echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
              echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
            fi
            echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | SUCCESS | Stable deployment |" >> docs/RELEASE_HISTORY.md
          EOF

      - name: Save persistent Release History
        if: always()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE_AUTH
            if [ -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p /var/tmp/BLACKHOLE_AUTH
              cp docs/RELEASE_HISTORY.md /var/tmp/BLACKHOLE_AUTH/RELEASE_HISTORY.md
            fi
          EOF

  rollback:
    name: Rollback on deployment failure
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Automatic Rollback on Failure
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE_AUTH

            # Robust parsing of Release History to extract the last healthy SHA
            if [ -f docs/RELEASE_HISTORY.md ] && grep -qE "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md; then
              LAST_HEALTHY_TAG=$(grep -E "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md | tail -n 1 | awk -F '|' '{
                for(i=1; i<=NF; i++) {
                  gsub(/[[:space:]]/, "", $i);
                  if ($i ~ /^[0-9a-f]{7}$/) {
                    print $i;
                    exit;
                  }
                }
              }')

              if [ -z "$LAST_HEALTHY_TAG" ]; then
                echo "⚠️ No last healthy tag extracted from Release History. Cannot perform automatic rollback."
                exit 1
              fi

              echo "🚨 Deployment failed! Rolling back to last healthy tag: $LAST_HEALTHY_TAG"

              # Re-generate active compose file from original template with the healthy tag
              sed "s|IMG_TAG|$LAST_HEALTHY_TAG|g" docker-compose.production.template.yml > docker-compose.production.yml

              # Log in to Docker Hub on the VM
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

              # Pull last healthy tag
              docker compose -f docker-compose.production.yml pull

              # Log out from Docker Hub
              docker logout

              # Deploy last healthy tag
              docker compose -f docker-compose.production.yml up -d --remove-orphans

              # Verify deployment status
              docker compose -f docker-compose.production.yml ps

              # Post-Rollback Verification
              echo "Waiting for rollback services to be healthy..."
              for i in {1..12}; do
                if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q >/dev/null 2>&1; then
                  UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                  STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
                else
                  UNHEALTHY_COUNT=0
                  STARTING_COUNT=0
                fi

                BACKEND_HEALTH=0
                BACKEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole_auth_backend 2>/dev/null || echo "missing")
                [ "$BACKEND_STATUS" = "healthy" ] && BACKEND_HEALTH=1

                FRONTEND_HEALTH=0
                FRONTEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole_auth_frontend 2>/dev/null || echo "missing")
                if [ "$FRONTEND_STATUS" = "healthy" ] || curl -sf http://localhost:5180 > /dev/null 2>&1; then
                  FRONTEND_HEALTH=1
                fi

                if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$BACKEND_HEALTH" -eq 1 ] && [ "$FRONTEND_HEALTH" -eq 1 ]; then
                  echo "Rollback deployment is healthy!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_SUCCESS | Rollback from failed ${{ needs.build.outputs.sha_short }} is healthy |" >> docs/RELEASE_HISTORY.md
                  exit 0
                fi

                if [ "$i" -eq 12 ]; then
                  echo "Rollback health check failed!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_FAILED | Rollback from failed ${{ needs.build.outputs.sha_short }} failed health check |" >> docs/RELEASE_HISTORY.md
                  exit 1
                fi

                echo "Status: $STARTING_COUNT starting, $UNHEALTHY_COUNT unhealthy, backend=$BACKEND_HEALTH, frontend=$FRONTEND_HEALTH. Retrying in 10s..."
                sleep 10
              done
            else
              echo "⚠️ No last healthy tag found in Release History. Cannot perform automatic rollback."
              if [ ! -f docs/RELEASE_HISTORY.md ]; then
                mkdir -p docs
                echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
                echo "" >> docs/RELEASE_HISTORY.md
                echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
                echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
              fi
              echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | FAILED | Deployment failed and no rollback tag was available |" >> docs/RELEASE_HISTORY.md
              exit 1
            fi
          EOF

      - name: Save persistent Release History
        if: always()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE_AUTH
            if [ -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p /var/tmp/BLACKHOLE_AUTH
              cp docs/RELEASE_HISTORY.md /var/tmp/BLACKHOLE_AUTH/RELEASE_HISTORY.md
            fi
          EOF
