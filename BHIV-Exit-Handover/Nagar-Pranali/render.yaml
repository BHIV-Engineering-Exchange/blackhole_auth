# Render Blueprint — deploy backend from GitHub
# Dashboard: New > Blueprint > connect this repo, or create a Web Service manually with the same settings.

services:
  - type: web
    name: uccis-backend
    runtime: node
    rootDir: UCCIS -Main/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_URL
        sync: false
